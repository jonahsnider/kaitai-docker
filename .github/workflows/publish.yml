name: Publish

on:
  push:
    branches:
      - main

jobs:
  publish:
    strategy:
      matrix:
        kaitai-version:
          - "0.11"
          - "0.10"
          - "0.9"
          - "0.8"
          - "0.7"
          - "0.6"
          - "0.5"
          - "0.4"
          - "0.3"
          - "0.2"

    name: Build and publish Docker image (v${{ matrix.kaitai-version }})

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: jonahsnider/kaitai-struct-compiler:${{ matrix.kaitai-version }}
          file: ./${{ matrix.kaitai-version }}.Dockerfile
